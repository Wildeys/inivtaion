<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our 9th Anniversary Dinner | Thai Aroi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Cinzel:wght@500;700&family=Jost:wght@300;400;500&display=swap');

  :root{
    --navy: #101b34;
    --navy-deep: #0a1226;
    --gold: #c9a24a;
    --gold-light: #e6cd8a;
    --maroon: #7c1f38;
    --cream: #f6ecda;
    --blush: #e6a3b8;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(ellipse at 50% 20%, #16234a 0%, var(--navy) 45%, var(--navy-deep) 100%);
    font-family: 'Jost', sans-serif;
    color: var(--cream);
    overflow-x:hidden;
  }

  .petals{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .petal{
    position:absolute;
    top:-5%;
    width:10px; height:10px;
    border-radius: 0 60% 0 60%;
    background: linear-gradient(135deg, var(--blush), var(--maroon));
    opacity:.35;
    animation: drift linear infinite;
  }
  @keyframes drift{
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(30px) rotate(220deg); }
  }

  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6vh 5vw;
  }

  .landing{
    text-align:center;
    max-width: 540px;
    transition: opacity .7s ease, transform .7s ease, filter .7s ease;
  }
  .landing.hidden{
    opacity:0;
    transform: scale(.94);
    filter: blur(6px);
    pointer-events:none;
    position:absolute;
  }

  .eyebrow{
    font-family:'Cinzel', serif;
    letter-spacing: .35em;
    font-size: .68rem;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 1.4rem;
  }

  .eyebrow::before, .eyebrow::after{
    content:'✦';
    color: var(--gold);
    margin: 0 .8em;
    font-size:.6rem;
  }

  h1.invite-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height:1.1;
    margin: 0 0 .6rem;
    color: var(--cream);
  }

  h1.invite-title em{
    display:block;
    font-style: italic;
    color: var(--blush);
    font-size: 1.1em;
    margin-top:.15em;
  }

  .invite-sub{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: #cfd6e8;
    max-width: 380px;
    margin: 0 auto 2.6rem;
    line-height:1.6;
  }

  .seal-wrap{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap: .9rem;
  }

  .seal{
    --size: 128px;
    width: var(--size);
    height: var(--size);
    border-radius:50%;
    border:none;
    cursor:pointer;
    position:relative;
    background:
      radial-gradient(circle at 35% 30%, #9a2c48, var(--maroon) 55%, #5c1327 100%);
    box-shadow:
      0 0 0 4px rgba(201,162,74,.18),
      0 0 0 1px rgba(201,162,74,.55),
      0 10px 30px rgba(0,0,0,.45),
      inset 0 2px 4px rgba(255,255,255,.15),
      inset 0 -6px 14px rgba(0,0,0,.4);
    color: var(--gold-light);
    font-family:'Cinzel', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .seal:hover{
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 0 0 4px rgba(201,162,74,.28),
      0 0 0 1px rgba(201,162,74,.75),
      0 14px 36px rgba(0,0,0,.5),
      inset 0 2px 4px rgba(255,255,255,.2),
      inset 0 -6px 14px rgba(0,0,0,.4);
  }
  .seal:focus-visible{
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
  }
  .seal:active{ transform: translateY(0) scale(.97); }

  .seal svg{ width: 46%; height: 46%; }

  .seal-label{
    font-family:'Cinzel', serif;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold-light);
  }

  .seal.cracking{
    animation: crack .55s ease forwards;
  }
  @keyframes crack{
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.08) rotate(-3deg); }
    60%  { transform: scale(.9) rotate(4deg); filter: brightness(1.4); }
    100% { transform: scale(0) rotate(20deg); opacity:0; }
  }

.reveal{
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: safe center;
  justify-content: safe center;
  padding: 4vh 5vw;
  overflow-y: auto;
  overscroll-behavior: contain;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .6s ease, visibility 0s linear .6s;
}

.reveal.show{
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .6s ease;
}

.reveal-inner{
  width: 100%;
  max-width: 460px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.4rem;
  transform: scale(.85) translateY(14px);
  transition: transform .9s cubic-bezier(.2,.7,.2,1);
}

.reveal.show .reveal-inner{
  transform: scale(1) translateY(0);
}

  .card-frame{
    position:relative;
    border-radius: 4px;
    padding: 10px;
    background: linear-gradient(160deg, var(--gold-light), var(--gold) 40%, #8a6a25 100%);
    box-shadow: 0 25px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(201,162,74,.4);
  }
  .card-frame img{
    display:block;
    width:100%;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 2px;
    background: #f6ecda;
  }

  .card-glow{
    position:absolute;
    inset:-40px;
    background: radial-gradient(circle, rgba(201,162,74,.35), transparent 70%);
    z-index:-1;
    opacity:0;
    transition: opacity 1.1s ease .2s;
  }
  .reveal.show .card-glow{ opacity:1; }

  .close-btn{
    font-family:'Jost', sans-serif;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--cream);
    background: transparent;
    border: 1px solid rgba(230,205,138,.5);
    border-radius: 999px;
    padding: .55rem 1.4rem;
    cursor:pointer;
    transition: background .25s ease, border-color .25s ease;
  }
  .close-btn:hover{
    background: rgba(230,205,138,.12);
    border-color: var(--gold-light);
  }
  .close-btn:focus-visible{
    outline: 2px solid var(--gold-light);
    outline-offset: 3px;
  }

  footer{
    position: fixed;
    bottom: 14px;
    left: 0; right:0;
    text-align:center;
    font-size: .68rem;
    letter-spacing:.15em;
    color: rgba(230,205,138,.4);
    text-transform: uppercase;
    z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 560px){
    .stage{
      padding: 5vh 6vw 9vh;
      align-items: flex-start;
      padding-top: max(6vh, env(safe-area-inset-top) + 24px);
    }

    .landing, .reveal-inner{ width:100%; }

    .reveal{
      padding: max(4vh, env(safe-area-inset-top) + 16px) 6vw max(4vh, env(safe-area-inset-bottom) + 16px);
    }

    .eyebrow{
      font-size: .6rem;
      letter-spacing: .28em;
      margin-bottom: 1.1rem;
    }
    .eyebrow::before, .eyebrow::after{ margin: 0 .55em; }

    h1.invite-title{
      font-size: clamp(2rem, 9vw, 2.6rem);
    }
    h1.invite-title em{ font-size: 1.05em; }

    .invite-sub{
      font-size: 1.02rem;
      max-width: 300px;
      margin-bottom: 2.1rem;
    }

    .seal{ --size: 104px; }
    .seal-label{ font-size: .66rem; letter-spacing: .18em; }

    .card-frame{ padding: 7px; }
    .card-frame img{ max-height: 62vh; }

    .close-btn{
      padding: .6rem 1.5rem;
      font-size: .74rem;
    }

    footer{
      position: static;
      margin-top: 2.5rem;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      font-size: .6rem;
      letter-spacing: .1em;
    }

    .reveal-inner{ gap: 1.1rem; }
  }

  @media (max-width: 560px) and (max-height: 700px){
    .card-frame img{ max-height: 52vh; }
  }

  @media (max-width: 560px){
    .petal:nth-child(n+9){ display:none; }
  }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="stage">

  <div class="landing" id="landing">
    <p class="eyebrow">Anniversary Dinner</p>
    <h1 class="invite-title">Happy 9th Anniversary<em>Dinner at Thai Aroi</em></h1>
    <p class="invite-sub">Break the seal to open the invitation.</p>

    <div class="seal-wrap">
      <button class="seal" id="sealBtn" aria-label="Open the invitation">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 3c-1.5 2-1.5 4 0 6-1.5-2-3.5-2-5-0.5C8.5 10 8.5 12 7 13.5c2-1.5 4-1.5 6 0-2-1.5-2-3.5-0.5-5C11 7 13 7 14.5 5.5c-2 1.5-4 1.5-6 0 1.5 2 1.5 4 0 6M12 13v8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="seal-label">Open Invitation</span>
    </div>
  </div>

  <div class="reveal" id="reveal">
    <div class="reveal-inner">
      <div class="card-frame">
        <div class="card-glow"></div>
        <img src="invitation.png" alt="9th anniversary dinner invitation at Thai Aroi — location Thai Aroi, 20:00, with menu of Fried Thai Shrimp Cake, Lobster Pad Thai, Tom Yum Chicken, Steamed Sea Bass with Lime, Green Curry Chicken, Taro Bua Loi, and Signature Drinks.">
      </div>
      <button class="close-btn" id="closeBtn">Close</button>
    </div>
  </div>

</div>

<footer>Nine years of love, laughter &amp; wonderful memories</footer>

<script>
  const petalHost = document.getElementById('petals');
  const PETAL_COUNT = 14;
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.animationDuration = (14 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's';
    petalHost.appendChild(p);
  }

  const sealBtn = document.getElementById('sealBtn');
  const landing = document.getElementById('landing');
  const reveal = document.getElementById('reveal');
  const closeBtn = document.getElementById('closeBtn');

  sealBtn.addEventListener('click', () => {
    sealBtn.classList.add('cracking');
    setTimeout(() => {
      landing.classList.add('hidden');
      reveal.classList.add('show');
      closeBtn.focus();
    }, 420);
  });

  closeBtn.addEventListener('click', () => {
    reveal.classList.remove('show');
    landing.classList.remove('hidden');
    sealBtn.classList.remove('cracking');
    setTimeout(() => sealBtn.focus(), 300);
  });
</script>

</body>
</html>
